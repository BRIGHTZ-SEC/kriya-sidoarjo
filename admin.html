<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin — Toko Kriya Sidoarjo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/store.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body" data-page="admin">

  <div class="admin-shell">
    <aside class="admin-side" id="admin-side" aria-label="Menu admin">
      <div class="admin-brand">
        <span class="brand-logo"><svg class="icon"><use href="#i-batik"/></svg></span>
        <div>
          <b>Toko Kriya</b>
          <span>Panel Admin</span>
        </div>
      </div>
      <nav class="admin-nav" id="admin-nav"></nav>
      <div class="admin-side-foot">
        <a class="btn btn-ghost btn-sm btn-block" href="index.html" target="_blank" rel="noopener">
          <svg class="icon"><use href="#i-external"/></svg> Lihat Toko
        </a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="icon-btn admin-burger" id="admin-burger" aria-label="Buka menu admin">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <div class="admin-title">
          <h2 id="admin-title">Dashboard</h2>
          <span class="crumb" id="admin-crumb">Ringkasan toko</span>
        </div>
        <div class="admin-top-actions">
          <button class="icon-btn theme-toggle" id="admin-theme" aria-label="Ganti tema">
            <svg class="icon"><use href="#i-sun"/></svg>
            <svg class="icon"><use href="#i-moon"/></svg>
          </button>
          <div class="admin-user">
            <span class="avatar" id="admin-avatar">A</span>
            <div class="au-text">
              <b id="admin-name">Admin</b>
              <span id="admin-email">admin@tokokriya.id</span>
            </div>
          </div>
        </div>
      </header>

      <main class="admin-view" id="admin-view">
        <div class="card card-pad">
          <div class="skeleton" style="height:24px;width:30%"></div>
          <div class="skeleton" style="height:15px;width:55%;margin-top:12px"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
